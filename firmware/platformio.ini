; PlatformIO Project Configuration for STM32 Industrial Evaluation Board
; Kadir Mercan (Mercan Studio)

[platformio]
default_envs = stm32f103rd

[env:stm32f103rd]
platform = ststm32
board = genericSTM32F103RD
framework = arduino

monitor_speed = 115200

build_flags = 
    -D HSE_VALUE=8000000UL
    -I include

upload_protocol = stlink
